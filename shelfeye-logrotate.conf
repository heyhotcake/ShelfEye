# ShelfEye Log Rotation Configuration
# Install: sudo cp shelfeye-logrotate.conf /etc/logrotate.d/shelfeye
# Test: sudo logrotate -d /etc/logrotate.d/shelfeye

/home/naniwa/ShelfEye/logs/*.log {
    # Rotate when file reaches 5MB
    size 5M
    
    # Keep 7 rotated files
    rotate 7
    
    # Compress old logs
    compress
    delaycompress
    
    # Don't error if log file is missing
    missingok
    
    # Don't rotate if log is empty
    notifempty
    
    # Add date extension to rotated files
    dateext
    dateformat -%Y%m%d
    
    # Copy then truncate (allows app to keep writing)
    copytruncate
    
    # Create new log files with correct permissions
    create 0644 naniwa naniwa
}
